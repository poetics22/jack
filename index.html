<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b0b12" />
  <title>Jack</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="stage" aria-label="Photos and videos of Jack">
    <div id="layer"></div>

    <!-- Big tap zones: left = back, right = forward -->
    <button id="prev" class="zone l" aria-label="Previous"></button>
    <button id="next" class="zone r" aria-label="Next"></button>

    <header id="top">
      <span class="name"><small>In loving memory</small>Jack</span>
      <div class="ctrls">
        <button id="mute" class="chip" aria-label="Mute videos" aria-pressed="false"></button>
        <button id="play" class="chip" aria-label="Play slideshow" aria-pressed="false">&#9654;</button>
      </div>
    </header>

    <nav id="filters" aria-label="Filter"></nav>

    <div id="hint">tap the right side to move forward &middot; left to go back</div>

    <footer id="bot">
      <p id="cap" aria-live="polite"></p>
      <div id="count"></div>
    </footer>
    <div id="rail"><i></i></div>

    <div id="empty" hidden>
      <p>No photos loaded yet.</p>
      <p class="sub">Run the review tool, then rebuild.</p>
    </div>
  </main>

  <!-- Generated by build-media.sh — inlined so the app also works by double-clicking (file://) -->
  <script src="media.js"></script>
  <script src="app.js"></script>
</body>
</html>
